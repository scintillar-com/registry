component: PasswordInput
wcag: AA
standard: WAI-ARIA 1.2
element: input
role: null
delegatesTo: input
description: >
  Renders a native <input> element with type="password" or type="text" depending
  on visibility state. Includes a toggle button for showing/hiding the password
  and optional strength indicator.

keyboard:
  - key: Enter
    action: Submits the form (native input behavior)
  - key: Space
    action: Toggles password visibility when the toggle button is focused
  - key: Enter
    action: Toggles password visibility when the toggle button is focused
  - key: Tab
    action: Moves focus between the input and the visibility toggle button

focus:
  visible: true
  trapped: false
  notes: >
    Focus ring appears on both the input field and the toggle button
    independently. The toggle button is positioned inside the input visually
    but is a separate focusable element.

screenReader:
  announcements:
    - The input is announced as a text or password field depending on visibility state
    - The toggle button is announced with aria-label "Show password" or "Hide password"
    - Strength indicator and checks are visual only
  notes: >
    Consider adding aria-describedby linking the input to the strength
    indicator for screen reader users.

contrast:
  text: "Meets WCAG AA (>4.5:1 for input text and labels)"
  ui: "Meets WCAG AA (>3:1 for borders, focus rings, and strength indicator bars)"

motion:
  reducedMotion: All transitions respect prefers-reduced-motion

consumerResponsibilities:
  - Always pair with a visible <label> element or provide an aria-label
  - When using showStrength or showChecks, consider adding aria-describedby for the strength feedback
  - Handle form validation and provide accessible error messages
