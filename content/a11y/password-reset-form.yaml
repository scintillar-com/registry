component: PasswordResetForm
wcag: AA
standard: WAI-ARIA 1.2
element: form
role: form
delegatesTo: null
description: >
  A form section for resetting the user's password. Includes current password,
  new password, and confirm password fields with a visibility toggle.

keyboard:
  - key: Tab
    action: Navigates between password fields, visibility toggle, and action buttons
  - key: Enter
    action: Submits the form when a field or the submit button is focused
  - key: Space
    action: Toggles the password visibility button when focused

focus:
  visible: true
  trapped: false
  notes: >
    Focus follows natural tab order through inputs and buttons. The password
    visibility toggle is focusable and operates as a button.

screenReader:
  announcements:
    - Each password input is announced with its associated label
    - The visibility toggle announces its current state (show/hide)
    - Action buttons are announced as their visible text
  notes: null

contrast:
  text: "Meets WCAG AA (>4.5:1 for all text)"
  ui: "Meets WCAG AA (>3:1 for borders and focus rings)"

motion:
  reducedMotion: All transitions respect prefers-reduced-motion

consumerResponsibilities:
  - Ensure onSubmit validates password requirements and communicates result
  - Provide error messaging for mismatched passwords or weak passwords
